<div class="min-vh-100 bg-dark d-flex align-items-center justify-content-center p-3">
  <!-- Login Card Container (Rectangular borders) -->
  <div class="card bg-black border border-secondary rounded-0 p-4 p-md-5 shadow-lg mx-auto" style="max-width: 420px; width: 100%;">
    <!-- Header / Brand -->
    <div class="text-center mb-4">
      <div class="badge bg-primary fs-3 px-3 py-2 rounded-0 mb-3 font-monospace">
        FZ
      </div>
      <h3 class="fw-bold text-white mb-1">Acceso a Firmeza</h3>
      <p class="text-secondary small">Sistema de Control de Inventario & Almacén</p>
    </div>

    <!-- Login Form Placeholder -->
    <form (submit)="$event.preventDefault()">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-bold text-uppercase">Usuario o Correo</label>
        <input type="email" class="form-control bg-dark border-secondary text-light placeholder-secondary rounded-0" placeholder="admin@firmeza.com">
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label text-secondary small fw-bold text-uppercase mb-0">Contraseña</label>
          <a href="#" class="text-primary small text-decoration-none">¿Olvidaste tu clave?</a>
        </div>
        <input type="password" class="form-control bg-dark border-secondary text-light placeholder-secondary rounded-0" placeholder="••••••••••••">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input bg-dark border-secondary rounded-0" type="checkbox" id="remember">
        <label class="form-check-label text-secondary small" for="remember">
          Recordar sesión en este equipo
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-0">
        Iniciar Sesión
      </button>
    </form>

    <!-- Footer Security Notice -->
    <div class="border-top border-secondary mt-4 pt-3 text-center text-secondary style-small" style="font-size: 0.8rem;">
      Acceso restringido únicamente a personal autorizado de Firmeza.
    </div>
  </div>
</div>
